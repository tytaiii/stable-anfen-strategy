[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stable-anfen-strategy"
version = "0.1.0"
description = "Unleveraged BTC/BNB strategy focused on drawdown control, combining ML timing, trend following, and 70/30 rotation."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Letian Xie" }]
keywords = ["quantitative-trading", "algorithmic-trading", "cryptocurrency", "bitcoin", "machine-learning", "backtesting", "momentum"]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "requests>=2.28",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
py-modules = ["stable_anfen_strategy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
